[package]
name = "lingo-arifiye"
version = "1.0.0"
edition = "2021"

[lib]
name = "lingo_arifiye_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
strip = true
lto = true
opt-level = "s"
